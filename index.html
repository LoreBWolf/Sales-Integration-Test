<!DOCTYPE html>
<html>
<head>
    <title>Project Onboarding POC</title>
    <style>
        body { font-family: -apple-system, sans-serif; line-height: 1.6; max-width: 500px; margin: 40px auto; padding: 20px; }
        form { border: 1px solid #eee; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #00c2e0; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
    <!-- Start of HubSpot Embed Code -->
    <script type="text/javascript" id="hs-script-loader" async defer src="//js-na2.hs-scripts.com/245446170.js"></script>
    <!-- End of HubSpot Embed Code -->
</head>
<body>
    <form id="prospect-form">
        <h2>Start Your Project</h2>
        <input type="text" name="firstname" placeholder="First Name" required>
        <input type="text" name="lastname" placeholder="Last Name" required>
        <input type="email" name="email" placeholder="Work Email" required>
        <input type="text" name="company" placeholder="Company Name" required>
        <textarea name="description" placeholder="Project Scope/Brief"></textarea>
        <button type="submit">Submit Request</button>
    </form>

    </body>

</html>
